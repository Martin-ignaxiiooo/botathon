# PostgREST de PlanBot (nativo en la VM o Docker). SIN credenciales: db-uri y jwt-secret se leen del entorno
# (PostgREST interpola $(VARIABLE)); el lanzador las toma de .env:
#   PGRST_DB_URI      = postgres://web_lectura:<WEB_LECTURA_PASSWORD>@localhost:5432/planbot
#   PGRST_JWT_SECRET  = secreto de 32 caracteres o más (lo genera scripts\instalar_sin_docker.ps1)
# Sin token: rol web_lectura (solo lectura de api.*). Con un JWT HS256 {"role":"planificador"} firmado con ese
# secreto (scripts\token_planificador.ps1): rol planificador, que puede ejecutar decidir_escenario().
db-uri = "$(PGRST_DB_URI)"
db-schemas = "api"
db-anon-role = "web_lectura"
db-config = false
jwt-secret = "$(PGRST_JWT_SECRET)"
jwt-secret-is-base64 = false
jwt-role-claim-key = ".role"
server-host = "127.0.0.1"
server-port = 3000
server-cors-allowed-origins = "http://localhost:8080"
