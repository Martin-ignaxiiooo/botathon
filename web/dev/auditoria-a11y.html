<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Auditoría de accesibilidad (herramienta de desarrollo)</title>
<script type="module">
// Herramienta de desarrollo (no es parte de la demo): corre axe-core sobre cada pantalla y estado (WCAG 2.1 A/AA).
// Uso: descargar axe-core 4.10.2 a web\dev\axe.min.js (https://cdn.jsdelivr.net/npm/axe-core@4.10.2/axe.min.js),
// servir web\ y abrir http://localhost:8080/dev/auditoria-a11y.html ; el resultado queda en <pre id="salida"> (JSON).
const RUTAS = ['#nacional', '#nacional?it=131&area=KI&desde=2&hasta=8', '#instituto?it=131', '#profesional', '#profesional?persona=118826',
  '#cambios?carga=2', '#cambios?carga=1', '#parametros', '#cuadratura'];
const ESTADOS = { normal: [], accesible: ['lectura-facil', 'letra-grande'] };
const esperar = (ms) => new Promise((r) => setTimeout(r, ms));
const resultado = {};
const marco = document.createElement('iframe'); marco.style.cssText = 'width:1300px;height:1000px;border:0';
document.body.append(marco);
await new Promise((r) => { marco.onload = r; marco.src = '../index.html#nacional'; });
await esperar(1500);
const d = marco.contentDocument, w = marco.contentWindow;
await new Promise((r) => { const s = d.createElement('script'); s.src = '/dev/axe.min.js'; s.onload = r; d.head.append(s); });
for (const [estado, clases] of Object.entries(ESTADOS)) {
  d.documentElement.classList.remove('lectura-facil', 'letra-grande');
  clases.forEach((c) => d.documentElement.classList.add(c));
  for (const ruta of RUTAS) {
    w.location.hash = ruta; await esperar(1800);
    d.querySelectorAll('.cab-grafico button, .tarjeta button[aria-controls]').forEach((b) => { if (b.getAttribute('aria-expanded') === 'false') b.click(); });
    d.querySelector('.boton-area')?.click(); await esperar(600);
    const r = await w.axe.run(d, { runOnly: { type: 'tag', values: ['wcag2a', 'wcag2aa', 'wcag21a', 'wcag21aa'] } });
    resultado[`${estado} ${ruta}`] = r.violations.map((v) => ({ id: v.id, impacto: v.impact, n: v.nodes.length,
      ejemplos: v.nodes.slice(0, 3).map((n) => `${n.target.join(' ')} :: ${(n.failureSummary || '').split('\n').slice(0, 2).join(' ').slice(0, 220)}`) }));
    resultado[`${estado} ${ruta}`].push({ pasan: r.passes.length, incompletas: r.incomplete.map((i) => `${i.id}: ` + i.nodes.slice(0, 4).map((n) => n.target.join(' ') + ' → ' + (n.any[0]?.message || '').slice(0, 120)).join(' | ')).join(' ## ') });
  }
}
document.body.insertAdjacentHTML('beforeend', `<pre id="salida">${JSON.stringify(resultado)}</pre>`);
</script></head><body></body></html>
